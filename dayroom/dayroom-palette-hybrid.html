<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dayroom — 混合色板 Demo</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow-x: hidden;
      background: rgb(242 239 232);
      font-family: "Avenir Next", Avenir, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }

    .dayroom-panel {
      --paper-bg: 251 248 239;
      --ink: 45 45 51;
      --heading: 35 35 42;
      --muted: 116 115 123;
      --md-char: 163 162 170;
      --accent: 111 118 152;
      --mark-text: 45 45 51;
      --mark-bg: 236 222 211;
      --border: 75 70 58;
      --room-glow: 255 222 164;
      --night-glow-opacity: 0;
      --ambient-wash: 255 255 255;
      --ambient-wash-opacity: 0;
      --daylight-opacity: 0.72;

      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 16% 12%,
          rgb(var(--room-glow) / var(--night-glow-opacity)),
          transparent 42%
        ),
        linear-gradient(
          rgb(var(--ambient-wash) / var(--ambient-wash-opacity)),
          rgb(var(--ambient-wash) / var(--ambient-wash-opacity))
        ),
        rgb(var(--paper-bg));
      color: rgb(var(--ink));
      transition: color 760ms cubic-bezier(0.42, 0, 0.2, 1);
    }

    .dayroom-panel::before {
      position: absolute;
      z-index: 0;
      inset: 0;
      content: "";
      pointer-events: none;
      background:
        linear-gradient(115deg, rgb(255 255 255 / 0.17), transparent 40%),
        repeating-linear-gradient(
          90deg,
          rgb(70 62 48 / 0.012) 0,
          rgb(70 62 48 / 0.012) 1px,
          transparent 1px,
          transparent 4px
        );
      opacity: 0.7;
    }

    .panel-label {
      position: absolute;
      z-index: 4;
      top: 18px;
      left: 20px;
      padding: 7px 11px;
      border: 1px solid rgb(var(--border) / 0.14);
      border-radius: 8px;
      background: rgb(var(--paper-bg) / 0.82);
      backdrop-filter: blur(10px);
      color: rgb(var(--muted));
      font-size: 0.68rem;
      font-weight: 650;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .panel-label strong {
      display: block;
      margin-bottom: 2px;
      color: rgb(var(--heading));
      font-size: 0.74rem;
    }

    .window-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .window-glow {
      z-index: 2;
      mix-blend-mode: var(--glow-blend-mode, screen);
    }

    .window-shadow {
      z-index: 3;
      mix-blend-mode: multiply;
      opacity: var(--daylight-opacity);
    }

    .mode-transition-light-clone {
      pointer-events: none;
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(100% - 40px, 980px);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(92px, 12vw, 132px) clamp(32px, 8vw, 96px) 140px;
    }

    .shell.mode-transition-clone {
      position: absolute;
      margin: 0;
      pointer-events: none;
      color: rgb(var(--ink));
    }

    .eyebrow {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 0 0 28px;
      color: rgb(var(--muted));
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 22px;
      height: 1px;
      content: "";
      background: rgb(var(--accent));
    }

    h1 {
      max-width: 760px;
      margin: 0;
      color: rgb(var(--heading));
      font-family: "Iowan Old Style", "Palatino Linotype", "Songti SC",
        "Noto Serif SC", serif;
      font-size: clamp(2.6rem, 6vw, 5.4rem);
      font-weight: 500;
      line-height: 1.02;
      letter-spacing: -0.045em;
      text-wrap: balance;
    }

    h1 span {
      color: rgb(var(--accent));
    }

    .dek {
      max-width: 650px;
      margin: 26px 0 58px;
      color: rgb(var(--muted));
      font-family: "Iowan Old Style", "Palatino Linotype", "Songti SC",
        "Noto Serif SC", serif;
      font-size: clamp(1.05rem, 2vw, 1.28rem);
      line-height: 1.75;
    }

    .prose {
      max-width: 720px;
      border-top: 1px solid rgb(var(--border) / 0.12);
      padding-top: 36px;
    }

    .prose p {
      margin: 0 0 1.35em;
      font-size: 1rem;
      line-height: 1.85;
      letter-spacing: 0.008em;
    }

    mark {
      padding: 0.08em 0.18em;
      border-radius: 0.18em;
      background: rgb(var(--mark-bg));
      color: rgb(var(--mark-text));
    }

    .swatch-row {
      display: flex;
      gap: 2px;
      max-width: 720px;
      margin-top: 34px;
      border-radius: 6px;
      overflow: hidden;
      opacity: 0.86;
    }

    .swatch {
      flex: 1;
      height: 15px;
    }

    .controls {
      position: fixed;
      z-index: 10;
      right: 22px;
      bottom: 22px;
      left: 22px;
      display: grid;
      grid-template-columns: auto minmax(180px, 1fr) auto;
      gap: 18px;
      align-items: center;
      width: min(760px, calc(100% - 44px));
      margin: 0 auto;
      padding: 13px 15px;
      border: 1px solid rgb(255 255 255 / 0.23);
      border-radius: 14px;
      background: rgb(30 29 25 / 0.82);
      color: rgb(247 242 231);
      box-shadow: 0 15px 45px rgb(12 11 9 / 0.23);
      backdrop-filter: blur(18px) saturate(1.2);
    }

    .clock {
      min-width: 104px;
      font-variant-numeric: tabular-nums;
    }

    .clock-time {
      display: block;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    .clock-state {
      display: block;
      margin-top: 2px;
      color: rgb(247 242 231 / 0.58);
      font-size: 0.67rem;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #e7b15f;
      cursor: ew-resize;
    }

    button {
      min-width: 78px;
      padding: 8px 12px;
      border: 1px solid rgb(255 255 255 / 0.16);
      border-radius: 9px;
      background: rgb(255 255 255 / 0.08);
      color: inherit;
      font: inherit;
      font-size: 0.76rem;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover {
      background: rgb(255 255 255 / 0.14);
    }

    button[aria-pressed="true"] {
      border-color: rgb(231 177 95 / 0.45);
      background: rgb(231 177 95 / 0.16);
      color: #ffd796;
    }

    @media (max-width: 700px) {
      .panel-label {
        top: 12px;
        left: 12px;
      }

      .shell {
        width: 100%;
        padding: 92px 28px 138px;
      }

      .controls {
        right: 10px;
        bottom: 10px;
        left: 10px;
        grid-template-columns: 1fr auto;
        width: calc(100% - 20px);
      }

      .controls input {
        grid-column: 1 / -1;
        grid-row: 2;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="dayroom-panel" id="panel-hybrid">
    <div class="panel-label">
      <strong>混合色板</strong>
      Interior Paper · Natural Light
    </div>
    <canvas class="window-layer window-glow" data-layer="glow" aria-hidden="true"></canvas>
    <canvas class="window-layer window-shadow" data-layer="shadow" aria-hidden="true"></canvas>

    <main class="shell" data-shell>
      <p class="eyebrow">Dayroom · Hybrid Palette</p>
      <h1>真实的昼夜，<br><span>光从窗外进来。</span></h1>
      <p class="dek">
        室内纸张保持稳定，窗外自然光按 24 个整点连续变化。环境光铺满纸面，
        百叶窗直射光保留日出淡粉、正午冷白与夕阳金橙。
      </p>

      <section class="prose" aria-label="混合色板可读性样例">
        <p>纸张材质使用低饱和室内色，长时间阅读时仍然安静；天空色只进入环境光、窗缝亮光和少量强调色。</p>
        <p>清晨与黄昏会更有情绪，正午则主动收敛。文字始终留在最清楚的一层，<mark>高亮内容</mark>也不会被光线吞没。</p>
      </section>

      <div class="swatch-row" id="swatch-hybrid" aria-hidden="true"></div>
    </main>
  </div>

  <div class="controls" aria-label="时间预览控制器">
    <div class="clock" aria-live="polite">
      <span class="clock-time" id="clock-time">08:30</span>
      <span class="clock-state" id="clock-state">清晨</span>
    </div>
    <input id="time-slider" type="range" min="0" max="1439" step="1" aria-label="预览时间">
    <button id="auto-button" type="button" aria-pressed="true">实时</button>
  </div>

  <script src="dayroom-engine.js?v=hybrid-ambient-wash"></script>
  <script>
    (() => {
      'use strict'

      const { DayroomEngine } = window
      const slider = document.getElementById('time-slider')
      const autoButton = document.getElementById('auto-button')
      const clockTime = document.getElementById('clock-time')
      const clockState = document.getElementById('clock-state')

      const hybridPanel = DayroomEngine.createDayroomPanel({
        container: document.getElementById('panel-hybrid'),
        paletteId: 'hybrid',
        prefix: 'hybrid-standalone',
      })

      const swatchContainer = document.getElementById('swatch-hybrid')
      swatchContainer.replaceChildren(...DayroomEngine.PALETTES.hybrid.map(color => {
        const swatch = document.createElement('span')
        swatch.className = 'swatch'
        swatch.style.background = `rgb(${color.join(', ')})`
        return swatch
      }))

      function currentMinute() {
        const now = new Date()
        return now.getHours() * 60 + now.getMinutes()
      }

      let auto = true
      let minute = currentMinute()

      function render(value) {
        minute = Math.round(Number(value))
        hybridPanel.render(minute)
        slider.value = String(minute)
        clockTime.textContent = DayroomEngine.formatTime(minute)
        clockState.textContent = DayroomEngine.stateAt(minute)
      }

      function setAuto(enabled) {
        auto = enabled
        autoButton.setAttribute('aria-pressed', String(enabled))
        autoButton.textContent = enabled ? '实时' : '预览'
        if (enabled) {
          render(currentMinute())
        }
      }

      slider.addEventListener('input', event => {
        setAuto(false)
        render(event.currentTarget.value)
      })

      autoButton.addEventListener('click', () => setAuto(!auto))

      setInterval(() => {
        if (auto && !document.hidden) {
          render(currentMinute())
        }
      }, 30_000)

      Object.defineProperty(window, '__dayroomHybrid', {
        configurable: true,
        value: Object.freeze({
          panel: hybridPanel,
          render,
        }),
      })

      render(minute)
    })()
  </script>
</body>
</html>
